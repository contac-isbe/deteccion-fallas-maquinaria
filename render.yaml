services:
  - type: web
    name: deteccion-fallas-maquinaria
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt && python scripts/prepare_deployment.py
    startCommand: gunicorn 'src.deployment:create_app()' --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
